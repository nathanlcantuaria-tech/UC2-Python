<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Hyrox Running</title>
</head>

<body>
    <header>
        <img src="media/hyrox_fitness.png" alt="Hyrox Running">

        <h1>Hyrox Running</h1>
        <p>O desafio de corrida que combina resistência e força!</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">O Evento</a></li>
            <li><a href="pag2.html">Desafio</a></li>
            <li><a href="pag3.html">Contatos</a></li>
        </ul>
    </nav>

    <main>

        <h2>Formulário de Interesse - HYROX</h2>

<form>
    <label for="nome">Nome completo:</label><br>
    <input type="text" id="nome" name="nome" required><br><br>

    <label for="email">E-mail:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="telefone">Telefone:</label><br>
    <input type="tel" id="telefone" name="telefone"><br><br>

    <label for="idade">Idade:</label><br>
    <input type="number" id="idade" name="idade" min="16" required><br><br>

    <label for="categoria">Categoria de interesse:</label><br>
    <select id="categoria" name="categoria" required>
        <option value="">Selecione uma categoria</option>
        <option value="open">Open</option>
        <option value="pro">Pro</option>
        <option value="doubles">Doubles</option>
        <option value="relay">Relay</option>
    </select><br><br>

    <label for="experiencia">Você já participou de uma HYROX?</label><br>
    <select id="experiencia" name="experiencia">
        <option value="">Selecione</option>
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
    </select><br><br>

    <label for="mensagem">Conte um pouco sobre seu interesse:</label><br>
    <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea><br><br>

    <button type="submit">Enviar inscrição</button>
</form>

    </main>
